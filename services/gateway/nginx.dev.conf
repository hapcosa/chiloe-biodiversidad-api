# nginx.dev.conf - Configuración de Nginx para desarrollo (ACTUALIZADA)
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de logs mejorado
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimizaciones básicas
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Configuración de gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting básico
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    # Upstream para Flora API
    upstream especies-api {
        server especies-api:9081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream para Auth Service
    upstream auth-service {
        server auth-service:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Configuración principal del servidor
    server {
        listen 80;
        listen [::]:80;
        server_name localhost chiloe.dev *.chiloe.dev;

        # Directorio raíz para archivos estáticos
        root /etc/nginx/html;
        index index.html index.htm;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        # Health check endpoint del gateway
        location = /health {
            access_log off;
            return 200 "Gateway healthy\n";
            add_header Content-Type text/plain;
        }

        # Métricas básicas de Nginx
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # ===== FLORA API ROUTES =====
        # Todas las rutas de especies-api van bajo /api/
        location /api/especies {
            limit_req zone=api burst=20 nodelay;

            # Requiere sesión válida; especies-api decide por rol si la mutación procede.
            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Manejo de errores
            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        location /api/v1/especies {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        location /api/v1/avistamientos {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Parques y áreas protegidas. Exige sesión como el resto de especies-api,
        # aunque solo tenga lecturas: sin el bloque, la ruta caería en `location /`
        # y el endpoint no existiría desde fuera.
        location /api/v1/areas-protegidas {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Portada de la app. Exige sesión como el resto de especies-api: sin
        # este bloque la ruta cae en `location /`, que devuelve el índice del
        # gateway con un 200 — el cliente no ve un error, ve una portada vacía.
        location /api/v1/portada {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Catálogo de categorías de moderación. Igual que el resto de especies-api,
        # exige sesión: la API decide por rol si la mutación procede (solo admin).
        location /api/v1/categorias {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Asignación de curadores. Va aparte de /api/v1/categorias porque
        # cuelga de /api/v1/moderadores; el prefijo de categorías ya cubre
        # /api/v1/categorias/:id/moderadores/:usuarioId.
        location /api/v1/moderadores {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Listado de usuarios del panel de curaduría. Lo sirve especies-api, que
        # cruza los usuarios del auth-service con las asignaciones de categoría
        # que viven en su base (ADR #27). El Authorization del cliente sigue
        # llegando al upstream: especies-api lo reenvía al auth-service, que
        # exige admin en su propio listado.
        location /api/v1/curaduria {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Postulaciones a curador: cualquier sesión puede crear la suya; la
        # bandeja completa y la resolución son de admin (lo decide la API).
        location /api/v1/postulaciones {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Insignias (Fase 9, PR 11). Todo bajo sesión: el catálogo y las
        # insignias de una persona se muestran dentro de la app, y no hay
        # ranking público que exponer. El recálculo y el otorgamiento manual
        # los restringe la API a rol admin.
        location /api/v1/insignias {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            # Más holgado que el resto: el recálculo recorre todos los
            # encuentros aprobados de una sentada.
            proxy_read_timeout 120s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # JSON Schemas de atributos por reino. Sin auth_request: son los mismos
        # archivos versionados en el repo público, y el panel los necesita para
        # construir el formulario antes de que haya sesión útil.
        location /api/v1/schemas {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        location /api/familias {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Manejo de errores
            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        location /api/generos {
            limit_req zone=api burst=20 nodelay;

            auth_request /auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Manejo de errores
            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        location /api/v1/uploads {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Servir imágenes estáticas
        location /api/images/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://especies-api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache para imágenes
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;

            # Timeouts más largos para subida de imágenes
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Manejo de errores
            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # Health check de Flora API
        location = /api/health {
            proxy_pass http://especies-api/health;
            access_log off;
            proxy_intercept_errors on;
            error_page 502 503 504 @especies_error;
        }

        # ===== AUTH SERVICE ROUTES =====
        # Todas las rutas de auth-service van bajo /api/v1/auth
        location /api/v1/auth {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://auth-service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts más cortos para auth
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Manejo de errores
            proxy_intercept_errors on;
            error_page 502 503 504 @auth_error;
        }

        # Rutas directas de auth-service (sin /api/v1)
        location /ready {
            proxy_pass http://auth-service/ready;
            access_log off;
            proxy_intercept_errors on;
            error_page 502 503 504 @auth_error;
        }

        location /alive {
            proxy_pass http://auth-service/alive;
            access_log off;
            proxy_intercept_errors on;
            error_page 502 503 504 @auth_error;
        }

        location /metrics {
            proxy_pass http://auth-service/metrics;
            access_log off;
            proxy_intercept_errors on;
            error_page 502 503 504 @auth_error;
        }

        # ===== ENDPOINTS ESPECIALES =====
        # Endpoint crítico para verificación de tokens (usado por otros servicios)
        location = /auth/verify {
            internal; # Solo accesible internamente
            proxy_pass http://auth-service/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Remote-Addr $remote_addr;
            proxy_set_header X-Original-Host $host;
        }

        # Métricas de los servicios
        location = /api/metrics {
            proxy_pass http://especies-api/health;
            access_log off;
            proxy_intercept_errors on;
            error_page 502 503 504 @service_unavailable;
        }

        location = /api/v1/auth/metrics {
            proxy_pass http://auth-service/api/v1/auth/metrics;
            access_log off;
            proxy_intercept_errors on;
            error_page 502 503 504 @service_unavailable;
        }

        # Documentación API (si existe)
        location = /docs {
            proxy_pass http://especies-api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 @docs_error;
        }

        # ===== PANEL DE CURADURÍA =====
        # SPA estática horneada en la imagen del gateway (ver Dockerfile). El
        # fallback a index.html es lo que hace funcionar el enrutado del cliente
        # cuando alguien recarga en /curaduria/especies/12.
        location /curaduria/ {
            # Sin add_header aquí: uno solo anularía todas las cabeceras de
            # seguridad heredadas del server. El noindex ya va en el <meta> del
            # index.html del panel.
            try_files $uri $uri/ /curaduria/index.html;
        }

        location = /curaduria {
            # Relativo: si fuera absoluto nginx reconstruiría el host y perdería
            # el puerto publicado por Docker.
            absolute_redirect off;
            return 301 /curaduria/;
        }

        # Los assets llevan hash en el nombre, así que se pueden cachear fuerte.
        location /curaduria/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ===== SERVIR ARCHIVO docs-api.json =====
        location = /docs-api.json {
            try_files /docs-api.json =404;
            add_header Content-Type application/json;
            add_header Cache-Control "public, max-age=300"; # Cache por 5 minutos
        }

        # ===== MANEJO DE OPCIONES CORS =====
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*' always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Type 'text/plain; charset=utf-8' always;
                add_header Content-Length 0 always;
                return 204;
            }

            # Servir el archivo docs-api.json como página principal
            try_files /docs-api.json =404;
            add_header Content-Type application/json;
        }

        # ===== PÁGINAS DE ERROR =====
        location @especies_error {
            return 502 '{"error": "Flora API service unavailable", "code": 502, "service": "especies-api", "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json always;
        }

        location @auth_error {
            return 502 '{"error": "Auth service unavailable", "code": 502, "service": "auth-service", "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json always;
        }

        location @docs_error {
            return 502 '{"error": "API documentation unavailable", "code": 502, "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json always;
        }

        location @service_unavailable {
            return 502 '{"error": "Service metrics unavailable", "code": 502, "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json always;
        }

        # Error pages estándar
        error_page 404 @not_found;
        error_page 500 502 503 504 @server_error;

        location @not_found {
            return 404 '{"error": "Endpoint not found", "code": 404, "message": "The requested resource was not found", "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json always;
        }

        location @server_error {
            return 500 '{"error": "Internal server error", "code": 500, "message": "The server encountered an internal error", "timestamp": "$time_iso8601"}';
            add_header Content-Type application/json always;
        }
    }
}
